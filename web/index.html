<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1216">
<title>小车中控台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <span id="conn" class="dot" title="连接状态"></span>
  <strong>小车中控台</strong>
  <span id="mode" class="chip">—</span>
  <span class="grow"></span>
  <span id="battery" class="stat" title="电池电压">🔋 —</span>
  <span id="rtt" class="stat" title="面板到小车的往返延迟">— ms</span>
</header>

<button id="estop" class="estop" type="button">急停</button>
<div id="estop-banner" class="banner hidden">
  <span>已急停<small id="estop-reason"></small></span>
  <button id="estop-release" type="button">解除急停</button>
</div>
<div id="offline" class="banner warn hidden">与小车的连接断开，正在重连…</div>

<main>
  <div class="card view">
    <canvas id="topdown" aria-label="俯视图：小车在中心，前方朝上"></canvas>
    <div class="view-tools">
      <button type="button" data-range="2">2 m</button>
      <button type="button" data-range="4" class="on">4 m</button>
      <button type="button" data-range="8">8 m</button>
    </div>
    <div id="view-note" class="view-note"></div>
  </div>

  <div id="camera-card" class="card camera hidden">
    <img id="cam" alt="相机画面">
  </div>

  <div class="sensors-wrap">
    <div class="card sensors">
      <button type="button" class="sensor" data-sensor="base"><b>底盘</b><span>关</span></button>
      <button type="button" class="sensor" data-sensor="lidar"><b>雷达</b><span>关</span></button>
      <button type="button" class="sensor" data-sensor="camera"><b>相机</b><span>关</span></button>
      <button type="button" id="beep" class="sensor small"><b>鸣笛</b><span>找车</span></button>
    </div>
    <div id="sensor-msg" class="msg"></div>
  </div>

  <div class="card drive">
    <div class="pads">
      <div class="pad" id="pad-move" aria-label="平移摇杆：上前、下后、左右平移"><div class="knob"></div><span>平移</span></div>
      <div class="pad pad-rot" id="pad-rot" aria-label="旋转：左拖左转，右拖右转"><div class="knob"></div><span>旋转</span></div>
    </div>
    <label class="slider"><span>线速度上限 <output id="vmax-out">0.30</output> m/s</span>
      <input id="vmax" type="range" min="0.05" max="0.7" step="0.05" value="0.3"></label>
    <label class="slider"><span>角速度上限 <output id="wmax-out">0.8</output> rad/s</span>
      <input id="wmax" type="range" min="0.2" max="1.5" step="0.1" value="0.8"></label>
    <div class="row">
      <button type="button" id="hand-back" disabled>退出手动</button>
      <span class="hint">电脑键盘：W/S 前后，A/D 平移，Q/E 旋转，Esc 急停</span>
    </div>
    <div id="cmd" class="cmd">输出 vx 0.00 · vy 0.00 · ω 0.00</div>
  </div>
</main>

<footer id="info">—</footer>
<script src="app.js"></script>
</body>
</html>
